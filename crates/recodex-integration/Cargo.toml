[package]
name = "recodex-integration"
version.workspace = true # recodex-overlay: 跟随产品版本,否则上报的 client_version 永远是 0.1.0
edition = "2021"
license = "AGPL-3.0-only"
description = "The single ReCodex adapter board for the Codex++ desktop upstream"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# native-certs: trust the OS certificate store (like curl and the Go CLI) instead
# of only ureq's bundled webpki-roots, so TLS to the API works behind corporate /
# regional root CAs and TLS-inspecting proxies where webpki-roots alone fails.
ureq = { version = "2.12", default-features = true, features = ["json", "native-certs"] }
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    # recodex-overlay: 读 HKCU\Environment,把 setx 写入的新 key 回填进本进程
    "Win32_System_Registry",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# 已经在依赖树里(macOS 上 reqwest 的传递依赖),不新增第三方来源。
security-framework = "3"
