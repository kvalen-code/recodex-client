name: macOS verify
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/recodex-integration/**"
      # 出货的 launcher 同样依赖 codex-plus-core:2026-09-05 只改 core 的那次推送
      # 因为不在这个名单里,一次 mac 校验都没跑。堵过发布通道的那批跨文件依赖
      # 恰恰住在 core 和 launcher 里。
      - "crates/codex-plus-core/**"
      - "apps/codex-plus-launcher/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/installer/macos/**"
permissions:
  contents: read
jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    # 挂死要快速失败:第一次跑就因为钥匙串弹授权框卡了 76 分钟才被人发现,
    # 而 mac runner 按 10 倍计费、默认上限 6 小时。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # CI runner 的登录钥匙串是锁着的,往里写会等一个永远不会有人点的授权框
      # —— 表现不是失败,是**挂住**。所以建一个专用的、已解锁的钥匙串,
      # 并设为默认,让 SecItemAdd 直接落进去。
      - name: 准备可写的钥匙串
        run: |
          set -euo pipefail
          security create-keychain -p ci recodex-ci.keychain
          security set-keychain-settings -lut 21600 recodex-ci.keychain
          security unlock-keychain -p ci recodex-ci.keychain
          security list-keychains -d user -s recodex-ci.keychain login.keychain
          security default-keychain -s recodex-ci.keychain

      # 钥匙串那层只能在真 mac 上验:编得过但存不进 = 用户登不上
      # 单独给这步设上限:上一次是整个 job 烧到 45 分钟才停,
      # 从日志才看出挂在哪个测试。步骤级超时能直接把手指到那一步。
      - name: 测试(含钥匙串往返)
        timeout-minutes: 35
        run: cargo test -p recodex-integration --target ${{ matrix.target }}
      - name: 构建
        run: cargo build --release --target ${{ matrix.target }} -p codex-plus-launcher
      # 版本号从 Cargo.toml 取,**不要写死**:写死会产出文件名与实际内容不符的包
      #(踩过一次 —— 源码 1.2.54,包却叫 1.2.50)。装完自报版本与文件名对不上,
      # 自更新会陷入死循环。Windows 侧专门加了校验防这件事,mac 侧却写死了。
      - name: 打 DMG 并自检
        run: |
          set -euo pipefail
          v="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "版本: $v"
          BINARY_DIR="$PWD/target/${{ matrix.target }}/release" \
            bash scripts/installer/macos/package-recodex-dmg.sh "$v" ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: recodex-macos-${{ matrix.arch }}-dmg
          path: dist/macos/*.dmg
