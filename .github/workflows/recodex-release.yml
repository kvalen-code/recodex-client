# ReCodex 客户端发布:打 tag → 云端构建 → 传 OSS → 自更新渠道就绪。
#
# 触发:推 client-v1.2.51 这样的 tag(或手动 workflow_dispatch 填版本号)。
# 版本号必须与 Cargo.toml 的 workspace.package.version 一致 —— 不一致就意味着
# 装完之后客户端仍自报旧版本,会永远提示"有更新"陷入死循环,所以这里硬校验。
#
# 产物两份,用途不同,不要混:
#   recodex.exe            自更新用。客户端下载后校验 sha256 再替换自身。
#   ReCodex-<版本>-windows-x64-setup.exe   首次安装用。放到官网下载页。
#
# Windows + macOS(x64/arm64)。**没有 Linux**:这个客户端靠注入官方 ChatGPT
# 桌面版工作,Linux 上没有官方桌面版,注入对象根本不存在 —— 出包也是废包。
#
# macOS 的凭据走钥匙串(crates/recodex-integration/src/credential.rs)。
# 这一层只能在 mac runner 上验证,所以 mac job 必须**跑测试**而不只是编译:
# 编得过但存不进钥匙串 = 用户登不上,而这恰恰是 mac 支持最容易悄悄坏掉的地方。

name: ReCodex release

on:
  push:
    tags: ["client-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号,例如 1.2.51(须与 Cargo.toml 一致)"
        required: true

permissions:
  contents: read

jobs:

# 为什么 OSS 上传是**可选**的:这个仓库是公开的,而对象存储的密钥是主账号级的 ——
# 把它放进公开仓库的 Secrets,风险面比省下的那点手工操作大得多。
# 没配密钥时 CI 只产出 artifact(构建与测试照跑),再由掌握密钥的机器取回上传。
  windows:
    runs-on: windows-latest
    env:
      # 提到 job 级只为一件事:让下面几个步骤的 `if:` 能看见它。
      # step 自己的 env 对同一个 step 的 if 不可见,写在那儿条件会恒假。
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 解析并校验版本号
        id: ver
        shell: pwsh
        run: |
          $input = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($input)) {
            $input = "${{ github.ref_name }}" -replace '^client-v', ''
          }
          # 客户端的规则比 semver 严:正好三段纯数字、无前导零
          if ($input -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "版本号不合法:「$input」"
          }
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($cargo -ne $input) {
            throw "tag 版本「$input」与 Cargo.toml 的「$cargo」不一致 —— 装完客户端会自报旧版本,永远提示有更新"
          }
          "version=$input" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 构建
        # --config .cargo/release.toml:出货专用,改写编进 exe 的源码路径(见该文件注释)
        run: cargo build --release -p codex-plus-launcher --config .cargo/release.toml
        env:
          # 手机远程:远程组件运行时的 minisign 发布公钥(与命令行 -X main.updatePublicKey 同一把)。
          # 编进 exe 后,下载运行时要求清单与压缩包都验签通过;没配则退回 HTTPS+SHA-256(同桌面自更新)。
          RECODEX_UPDATE_PUBLIC_KEY: ${{ vars.RECODEX_UPDATE_PUBLIC_KEY }}

      - name: 自检 —— exe 自报版本必须等于发布版本
        shell: pwsh
        run: |
          $v = (Get-Item target/release/recodex.exe).VersionInfo.FileVersion
          if ($v -ne "${{ steps.ver.outputs.version }}") {
            throw "exe 自报 $v,与发布版本 ${{ steps.ver.outputs.version }} 不一致"
          }

      # 去品牌的两道闸都在构建期,一旦失效不会有任何报错,只能在产物上查:
      #   - 版本资源的 ProductName 由 apps/codex-plus-launcher/build.rs 设置;
      #   - 源码路径由 .cargo/release.toml 的 --remap-path-prefix 改写(构建命令要带 --config)。
      #     漏了 --config、或有人在 CI 里设了 RUSTFLAGS 把它整体覆盖掉,exe 里重新冒出上百处 crates\codex-plus-core\...
      - name: 自检 —— exe 里不带上游品牌
        shell: pwsh
        run: |
          $info = (Get-Item target/release/recodex.exe).VersionInfo
          if ($info.ProductName -ne "ReCodex" -or $info.FileDescription -ne "ReCodex") {
            throw "exe 版本资源名字不对:ProductName=$($info.ProductName) FileDescription=$($info.FileDescription)"
          }
          $text = [System.Text.Encoding]::GetEncoding(28591).GetString([System.IO.File]::ReadAllBytes("target/release/recodex.exe"))
          $hits = [regex]::Matches($text, '(crates|apps)[\\/]codex-plus-').Count
          if ($hits -gt 0) {
            throw "exe 里还有 $hits 处 codex-plus 源码路径 —— .cargo/release.toml 的 remap 没生效(构建命令漏了 --config,或 CI 里设了 RUSTFLAGS?)"
          }

      # 租约直连的本机代理(sidecar)。Go 写的,与命令行同一份代码 —— 这个仓库是公开的、
      # Go 源码不在这里,所以不在这里编,而是取**已发布、已签名**的命令行包,改名放进安装包。
      #
      # 三道闸,任何一道不过都只是**跳过捆绑**(警告),不让发布失败:
      #   ① 与 SHA256SUMS 对得上;
      #   ② 真能跑,且认识 `lease desktop-follow`(老版命令行没有这个子命令 —— 捆进去只会
      #      让每次启动都记一条「看不懂的输出」);
      #   ③ 仓库变量 RECODEX_LEASE_SIDECAR 不是 off(一键不捆,回滚用)。
      # 没捆的包与今天完全一样:启动器找不到 sidecar 就什么都不做、一切走网关。
      - name: 取租约直连 sidecar(可选)
        if: vars.RECODEX_LEASE_SIDECAR != 'off'
        shell: pwsh
        run: |
          $base = "${{ vars.RECODEX_LEASE_SIDECAR_BASE || 'https://oss.jzspace.cn/client/cli/latest' }}"
          try {
            Invoke-WebRequest -Uri "$base/SHA256SUMS" -OutFile sidecar.sums -UseBasicParsing -TimeoutSec 60
            Invoke-WebRequest -Uri "$base/recodex.exe" -OutFile sidecar.exe -UseBasicParsing -TimeoutSec 120
          } catch {
            Write-Warning "取不到 sidecar,本包不捆绑:$($_.Exception.Message)"; exit 0
          }
          $want = (Get-Content sidecar.sums | Where-Object { $_ -match '\s\*?recodex\.exe$' } | Select-Object -First 1) -replace '\s.*$',''
          $got = (Get-FileHash sidecar.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($want) -or $want.ToLowerInvariant() -ne $got) {
            Write-Warning "sidecar 哈希与 SHA256SUMS 对不上(want=$want got=$got),本包不捆绑"; exit 0
          }
          # 关进临时目录跑:绝不碰 runner 的真用户目录。空 stdin = 没有令牌,新版必答 no_token。
          # stdin 必须真是空的(经 cmd 的 < NUL):PowerShell 往原生程序管道里写 '' 时
          # 可能带 BOM,新版会剥掉,但老版会把它当令牌拿去打一次生产控制面。
          # 另外把控制面指到回环的空端口,万一哪版判断失误也连不到生产。
          $sbx = Join-Path $env:RUNNER_TEMP "sidecar-sbx"
          New-Item -ItemType Directory -Force $sbx | Out-Null
          $env:USERPROFILE = $sbx; $env:HOME = $sbx; $env:CODEX_HOME = (Join-Path $sbx ".codex")
          $env:RECODEX_API = "http://127.0.0.1:9"
          $out = (cmd /c ".\sidecar.exe lease desktop-follow --api http://127.0.0.1:9 < NUL 2> NUL" | Out-String).Trim()
          if ($out -ne '{"outcome":"no_token"}') {
            Write-Warning "已发布的命令行还不支持 lease desktop-follow(输出:$out),本包不捆绑"; exit 0
          }
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item sidecar.exe dist/windows/app/recodex-lease.exe
          Write-Host "已捆绑 sidecar(sha256 $got)"

      - name: 装 NSIS
        run: choco install nsis -y --no-progress

      - name: 打安装包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item target/release/recodex.exe dist/windows/app/
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "makensis" }
          Push-Location scripts/installer/windows
          & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=${{ steps.ver.outputs.version }}" ReCodex.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS 失败" }
          Pop-Location

      - name: 生成 manifest(自更新用)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $exe = "target/release/recodex.exe"
          $sha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = $v
            url     = "${{ vars.RECODEX_CLIENT_BASE_URL }}/$v/recodex.exe"
            sha256  = $sha
          }
          New-Item -ItemType Directory -Force "dist/upload/$v" | Out-Null
          # 租约直连 sidecar:只有这次捆了(上面那一步三道闸都过了)才写进清单。
          # 自更新只换清单里列出的文件 —— 不写的话,靠自更新升级的老用户永远拿不到它。
          # 老客户端不认识这个字段,照常只换主程序。
          $sidecar = "dist/windows/app/recodex-lease.exe"
          if (Test-Path $sidecar) {
            # 只写文件名:客户端相对主程序 url 解析。主程序 url 由构建机的
            # publish-desktop.sh 改成绝对地址,它不认识 sidecar 字段 —— 相对写法不依赖它。
            $manifest.sidecar = [ordered]@{
              url    = "recodex-lease.exe"
              sha256 = (Get-FileHash -LiteralPath $sidecar -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            Copy-Item $sidecar "dist/upload/$v/"
          }
          # UTF8 无 BOM:BOM 会让部分 JSON 解析器把首字符当非法字符
          [System.IO.File]::WriteAllText(
            "dist/upload/$v/manifest.json",
            ($manifest | ConvertTo-Json -Depth 3),
            (New-Object System.Text.UTF8Encoding($false)))
          Copy-Item $exe "dist/upload/$v/"
          Copy-Item "dist/windows/ReCodex-$v-windows-x64-setup.exe" "dist/upload/$v/"
          Get-Content "dist/upload/$v/manifest.json"

      - name: 上传到 OSS
        if: env.OSS_ACCESS_KEY_ID != ''
        shell: pwsh
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Invoke-WebRequest -Uri "https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-windows-amd64.zip" -OutFile ossutil.zip -UseBasicParsing
          Expand-Archive ossutil.zip -DestinationPath ossutil -Force
          $oss = (Get-ChildItem ossutil -Recurse -Filter ossutil.exe | Select-Object -First 1).FullName
          # 对象级 public-read:桶本身保持私有,只有这些文件可公开下载
          foreach ($f in Get-ChildItem "dist/upload/$v") {
            & $oss cp $f.FullName "${{ vars.OSS_TARGET }}/$v/$($f.Name)" --acl public-read
            if ($LASTEXITCODE -ne 0) { throw "上传失败:$($f.Name)" }
          }

      - name: 回读校验 —— 公网真的取得到,且哈希与本地一致
        if: env.OSS_ACCESS_KEY_ID != ''
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $m = Invoke-RestMethod -Uri "${{ vars.RECODEX_CLIENT_BASE_URL }}/$v/manifest.json" -TimeoutSec 30
          $local = (Get-FileHash "dist/upload/$v/recodex.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($m.sha256 -ne $local) { throw "线上 manifest 的 sha256 与本地包体不一致" }
          if ($m.version -ne $v) { throw "线上 manifest 版本号不对:$($m.version)" }
          Invoke-WebRequest -Uri $m.url -Method Head -UseBasicParsing -TimeoutSec 30 | Out-Null
          Invoke-WebRequest -Uri "${{ vars.RECODEX_CLIENT_BASE_URL }}/$v/ReCodex-$v-windows-x64-setup.exe" -Method Head -UseBasicParsing -TimeoutSec 30 | Out-Null
          # sidecar 写进了清单就必须真取得到:取不到的话每个用户更新时都会记一条下载失败
          if ($m.sidecar) {
            $localSidecar = (Get-FileHash "dist/upload/$v/recodex-lease.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($m.sidecar.sha256 -ne $localSidecar) { throw "线上 manifest 的 sidecar sha256 与本地不一致" }
            Invoke-WebRequest -Uri "${{ vars.RECODEX_CLIENT_BASE_URL }}/$v/recodex-lease.exe" -Method Head -UseBasicParsing -TimeoutSec 30 | Out-Null
          }
          Write-Host "回读校验通过:manifest 与包体公网可取"

      # 官网下载页读的就是这个指针。放在 windows job 的最后:
      # mac 的 DMG 由 macos job 各自上传,这里只需要把地址算出来 ——
      # 写死版本号在前端,每发一版都要重新部署一次前端。
      - name: 更新 latest.json(官网下载页的指针)
        if: env.OSS_ACCESS_KEY_ID != ''
        shell: pwsh
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $base = "${{ vars.RECODEX_CLIENT_BASE_URL }}/$v"
          $latest = [ordered]@{
            version = $v
            assets  = [ordered]@{
              windows    = "$base/ReCodex-$v-windows-x64-setup.exe"
              macos_arm64 = "$base/ReCodex-$v-macos-arm64.dmg"
              macos_x64   = "$base/ReCodex-$v-macos-x64.dmg"
            }
          }
          [System.IO.File]::WriteAllText("latest.json",
            ($latest | ConvertTo-Json -Depth 4),
            (New-Object System.Text.UTF8Encoding($false)))
          $oss = (Get-ChildItem ossutil -Recurse -Filter ossutil.exe | Select-Object -First 1).FullName
          & $oss cp latest.json "${{ vars.OSS_TARGET }}/latest.json" --acl public-read --force
          if ($LASTEXITCODE -ne 0) { throw "latest.json 上传失败" }
          # 回读:下载页拿不到它就整页显示"尚未发布"
          $back = Invoke-RestMethod -Uri "${{ vars.RECODEX_CLIENT_BASE_URL }}/latest.json" -TimeoutSec 30
          if ($back.version -ne $v) { throw "线上 latest.json 版本是 $($back.version),不是 $v" }
          Write-Host "latest.json 已就位:$v"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recodex-${{ steps.ver.outputs.version }}-windows
          path: dist/upload/${{ steps.ver.outputs.version }}/

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      # 提到 job 级只为一件事:让下面几个步骤的 `if:` 能看见它。
      # step 自己的 env 对同一个 step 的 if 不可见,写在那儿条件会恒假。
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: 解析并校验版本号
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          v="${{ github.event.inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#client-v}"
          echo "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'             || { echo "版本号不合法:$v" >&2; exit 1; }
          cargo_v="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          [ "$cargo_v" = "$v" ]             || { echo "tag 版本 $v 与 Cargo.toml 的 $cargo_v 不一致" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # CI runner 的登录钥匙串是锁着的,写入会等一个永远不会有人点的授权框
      # —— 表现是**挂住**而不是失败(实测卡了 76 分钟)。建一个已解锁的专用钥匙串。
      - name: 准备可写的钥匙串
        run: |
          set -euo pipefail
          security create-keychain -p ci recodex-ci.keychain
          security set-keychain-settings -lut 21600 recodex-ci.keychain
          security unlock-keychain -p ci recodex-ci.keychain
          security list-keychains -d user -s recodex-ci.keychain login.keychain
          security default-keychain -s recodex-ci.keychain

      # 钥匙串那层只能在真 mac 上验。编得过但存不进 = 用户登不上。
      - name: 跑 recodex-integration 测试(含钥匙串往返)
        run: cargo test -p recodex-integration --target ${{ matrix.target }}

      - name: 构建
        run: cargo build --release --target ${{ matrix.target }} -p codex-plus-launcher --config .cargo/release.toml
        env:
          # 手机远程的发布公钥,说明见 Windows 那一步
          RECODEX_UPDATE_PUBLIC_KEY: ${{ vars.RECODEX_UPDATE_PUBLIC_KEY }}

      - name: 自检 —— 二进制里不带上游源码路径
        run: |
          if grep -a -c -E '(crates|apps)[/\]codex-plus-' "target/${{ matrix.target }}/release/recodex"; then
            echo "二进制里还有 codex-plus 源码路径 —— .cargo/release.toml 的 remap 没生效(构建命令漏了 --config,或 CI 里设了 RUSTFLAGS?)"
            exit 1
          fi

      # 租约直连 sidecar,规矩与 Windows 那一步相同(见其注释):取已发布的命令行包、
      # 对哈希、真跑一次认得 `lease desktop-follow` 才捆;任何一道不过只跳过、不让发布失败。
      - name: 取租约直连 sidecar(可选)
        if: vars.RECODEX_LEASE_SIDECAR != 'off'
        run: |
          set -uo pipefail
          base="${{ vars.RECODEX_LEASE_SIDECAR_BASE || 'https://oss.jzspace.cn/client/cli/latest' }}"
          name="recodex-darwin-$([ "${{ matrix.arch }}" = "arm64" ] && echo arm64 || echo amd64)"
          dest="$PWD/target/${{ matrix.target }}/release/recodex-lease"
          if ! curl -fsSL --max-time 60 -o sidecar.sums "$base/SHA256SUMS" \
             || ! curl -fsSL --max-time 120 -o sidecar.bin "$base/$name"; then
            echo "::warning::取不到 sidecar,本包不捆绑"; exit 0
          fi
          want="$(awk -v n="$name" '$2==n || $2=="*"n {print $1; exit}' sidecar.sums)"
          got="$(shasum -a 256 sidecar.bin | awk '{print $1}')"
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "::warning::sidecar 哈希与 SHA256SUMS 对不上(want=$want got=$got),本包不捆绑"; exit 0
          fi
          chmod +x sidecar.bin
          sbx="$(mktemp -d)"
          # 控制面指到回环空端口:自检绝不能连到生产。
          out="$(HOME="$sbx" CODEX_HOME="$sbx/.codex" RECODEX_API=http://127.0.0.1:9 ./sidecar.bin lease desktop-follow --api http://127.0.0.1:9 </dev/null 2>/dev/null)"
          rm -rf "$sbx"
          if [ "$out" != '{"outcome":"no_token"}' ]; then
            echo "::warning::已发布的命令行还不支持 lease desktop-follow(输出:$out),本包不捆绑"; exit 0
          fi
          cp sidecar.bin "$dest"
          echo "已捆绑 sidecar $name(sha256 $got)"

      - name: 打 DMG
        run: |
          BINARY_DIR="$PWD/target/${{ matrix.target }}/release"             bash scripts/installer/macos/package-recodex-dmg.sh             "${{ steps.ver.outputs.version }}" "${{ matrix.arch }}"

      - name: 上传到 OSS
        if: env.OSS_ACCESS_KEY_ID != ''
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          curl -fsSL -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-mac-$([ "${{ matrix.arch }}" = "arm64" ] && echo arm64 || echo amd64).zip
          unzip -q ossutil.zip -d ossutil
          oss="$(find ossutil -name ossutil -type f | head -1)"
          chmod +x "$oss"
          dmg="dist/macos/ReCodex-$v-macos-${{ matrix.arch }}.dmg"
          "$oss" cp "$dmg" "${{ vars.OSS_TARGET }}/$v/$(basename "$dmg")" --acl public-read

      - name: 回读校验
        if: env.OSS_ACCESS_KEY_ID != ''
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          url="${{ vars.RECODEX_CLIENT_BASE_URL }}/$v/ReCodex-$v-macos-${{ matrix.arch }}.dmg"
          remote="$(curl -fsSLI "$url" | grep -i '^content-length:' | tail -1 | tr -dc '0-9')"
          local_size="$(wc -c < "dist/macos/ReCodex-$v-macos-${{ matrix.arch }}.dmg")"
          [ "$remote" = "$local_size" ] || { echo "线上大小 $remote != 本地 $local_size" >&2; exit 1; }
          echo "回读校验通过"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recodex-${{ steps.ver.outputs.version }}-macos-${{ matrix.arch }}
          path: dist/macos/*.dmg
