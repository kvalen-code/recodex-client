# Windows 侧的编译与测试门禁。
#
# 这个工作流原本构建并打包 `apps/codex-plus-manager`(Tauri 管理器)——那是**已弃用、
# 不出货**的东西,而它的前端测试要读 `assets/inject/upstream/dream-skin/**`,
# 这批上游皮肤资源在 slim fork 里根本没有,于是 `Frontend tests` 每次必挂。
# 结果是这个工作流长期红、没人再看,等于 Windows 侧完全没有门禁 ——
# 比没有 CI 更糟,因为它看起来有。
#
# 现在只做一件事:**编译并测试真正出货的那三个 crate**。
# 打包交给 recodex-release.yml(打 tag 时跑,还带版本号硬校验和回读验证),
# 这里不重复产物。
#
# 为什么必须有 Windows 这一份:macOS verify 只在 macos runner 上跑,
# 而 Windows 独有的注册表/launchd 对偶、路径处理、进程枚举都只在这里才编得到。

name: PR build artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-check:
    name: Windows 编译与测试
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 与 recodex-release.yml 出货的范围一致:launcher 及它依赖的两个 crate。
      # 不用 --workspace:那会把已弃用的 manager 一起拖进来编。
      - name: 测试
        run: cargo test -p codex-plus-core -p recodex-integration -p codex-plus-launcher

      - name: 构建
        run: cargo build --release -p codex-plus-launcher
